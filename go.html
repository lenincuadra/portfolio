<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting…</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
<script>
(async function () {
  var SERVICE_ID  = "service_r954pt9";
  var TEMPLATE_ID = "template_fhi5v77";
  var PUBLIC_KEY  = "zdniFfke6xnYC8I4e";
  var TO_EMAIL    = "leninxperience@gmail.com";
  var STORAGE_KEY = "portfolio_visits";

  // Destinos permitidos. "dest" es opcional: si no viene, se mantiene
  // el comportamiento actual (siempre va al portfolio).
  var DESTINATIONS = {
    portfolio: "https://lenincuadra.com/",
    linkedin:  "https://www.linkedin.com/in/lenincuadra/",
    github:    "https://github.com/lenincuadra"
  };

  // "0628r4P" -> { code:"0628r4", link:"Portfolio" }; L -> LinkedIn; G -> GitHub.
  // Reserved/organic (no P/L/G suffix) pass through unchanged.
  var LINK_NAMES = { P: "Portfolio", L: "LinkedIn", G: "GitHub" };
  function parseRef(ref) {
    var m = /^(\d{4}[a-z][2-9])([PLG])$/.exec(ref);
    if (m) return { code: m[1], link: LINK_NAMES[m[2]] };
    return { code: ref, link: "" };
  }

  var params  = new URLSearchParams(window.location.search);
  var company = params.get("ref") || "";
  var destKey = params.get("dest") || "portfolio";
  var DEST    = DESTINATIONS[destKey] || DESTINATIONS.portfolio;

  // Bots/headless: redirigir sin trackear (misma guarda y mismo porqué que en
  // tracker.js — los crawlers ejecutan JS y disparaban mails de EmailJS; los
  // links de go.html viajan en CVs, DMs y LinkedIn, que los bots también
  // visitan). El bot llega al destino igual; solo se salta el registro.
  var BOT_UA = /bot|crawl|spider|slurp|headless|lighthouse|prerender|bingpreview|facebookexternalhit/i;
  if (navigator.webdriver || BOT_UA.test(navigator.userAgent)) {
    window.location.replace(DEST);
    return;
  }

  // Personalización por perfil (data/profiles.js): el link trackeado puede
  // traer &focus=<perfil> (genérico por industria, no delata la empresa: los
  // refs son códigos opacos a propósito). Se guarda SIEMPRE (también en "me")
  // y el index lo lee vía resolveActiveProfile().
  try {
    var focus = params.get("focus");
    if (focus) sessionStorage.setItem("portfolio_focus", focus);
  } catch (e) {}

  // Visita propia, redirigir sin trackear. Marcar la sesión como ya
  // trackeada para que tracker.js no la registre como "organic" al aterrizar.
  if (company === "me") {
    try { sessionStorage.setItem("portfolio_tracked", "1"); } catch (e) {}
    window.location.replace(DEST);
    return;
  }

  // Sin ref: cae en li-profile (LinkedIn limpia los ?ref= de los links del perfil)
  if (!company) company = "li-profile";

  // Separar el código base del identificador de link (P/L). Si el ref no trae
  // sufijo, el link se deriva del dest.
  var parsed = parseRef(company);
  var code   = parsed.code;
  var link   = parsed.link || (destKey === "linkedin" ? "LinkedIn" : destKey === "portfolio" ? "Portfolio" : "");
  company    = link ? code + " · " + link : code;

  var timestamp = new Date().toLocaleString("es-AR", {
    timeZone: "America/Argentina/Cordoba",
    day: "2-digit", month: "2-digit", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });

  // Geolocalización, fallback silencioso si falla
  var location = "Ubicación desconocida";
  try {
    var res = await fetch("https://ipapi.co/json/");
    var d   = await res.json();
    location = (d.city || "") + ", " + (d.country_name || "");
  } catch (e) {}

  // Guardar en localStorage
  try {
    var visits = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    visits.unshift({ company: company, timestamp: timestamp, location: location, dest: destKey, code: code, link: link });
    if (visits.length > 200) visits = visits.slice(0, 200);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(visits));
  } catch (e) {}

  // Enviar email, fallback silencioso si falla
  try {
    emailjs.init(PUBLIC_KEY);
    await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
      to_email:  TO_EMAIL,
      company:   company,
      code:      code,
      link:      link,
      timestamp: timestamp,
      location:  location,
      dest:      destKey
    });
  } catch (e) {}

  // Marcar sesión como ya trackeada para que tracker.js no dispare de nuevo
  try { sessionStorage.setItem("portfolio_tracked", "1"); } catch (e) {}

  // Guardar el ref para la personalización por perfil del index (data/profiles.js)
  try { sessionStorage.setItem("portfolio_ref", code); } catch (e) {}

  // Redirigir al destino correspondiente
  window.location.replace(DEST);
})();
</script>
</body>
</html>
